<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(0.35 0.15 260);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.25 0.10 260);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Browser chrome -->
  <rect width="1200" height="40" fill="oklch(0.20 0 0)"/>
  <circle cx="20" cy="20" r="6" fill="oklch(0.70 0.20 25)"/>
  <circle cx="40" cy="20" r="6" fill="oklch(0.75 0.15 80)"/>
  <circle cx="60" cy="20" r="6" fill="oklch(0.65 0.15 140)"/>
  
  <!-- Slide content -->
  <g transform="translate(100, 120)">
    <text x="0" y="0" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="700" fill="white">
      Welcome to Markdown Slides 🎯
    </text>
    <text x="0" y="100" font-family="'Inter', sans-serif" font-size="32" fill="oklch(0.85 0.05 260)">
      Transform markdown files into beautiful presentations
    </text>
    
    <!-- Feature bullets -->
    <g transform="translate(0, 180)">
      <text x="0" y="0" font-family="'Inter', sans-serif" font-size="28" fill="white">✍️ Markdown-First</text>
      <text x="0" y="50" font-family="'Inter', sans-serif" font-size="28" fill="white">⌨️ Keyboard Shortcuts</text>
      <text x="0" y="100" font-family="'Inter', sans-serif" font-size="28" fill="white">🎨 Multiple Themes</text>
      <text x="0" y="150" font-family="'Inter', sans-serif" font-size="28" fill="white">📱 Touch Support</text>
    </g>
  </g>
  
  <!-- Navigation controls -->
  <g transform="translate(50, 600)">
    <rect width="50" height="50" rx="8" fill="oklch(0.45 0.15 260)" opacity="0.3"/>
    <text x="25" y="35" font-size="24" fill="white" text-anchor="middle">←</text>
  </g>
  <g transform="translate(1100, 600)">
    <rect width="50" height="50" rx="8" fill="oklch(0.45 0.15 260)" opacity="0.3"/>
    <text x="25" y="35" font-size="24" fill="white" text-anchor="middle">→</text>
  </g>
  
  <!-- Progress indicator -->
  <text x="1150" y="30" font-family="'JetBrains Mono', monospace" font-size="14" fill="oklch(0.70 0.05 260)" text-anchor="end">
    1 / 25
  </text>
</svg>
