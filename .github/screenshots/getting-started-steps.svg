<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:oklch(0.45 0.15 260);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.55 0.18 260);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:oklch(0.50 0.15 200);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.60 0.18 200);stop-opacity:1" />
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:oklch(0.55 0.15 140);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.65 0.18 140);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="oklch(0.98 0 0)"/>
  
  <!-- Title -->
  <text x="600" y="40" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" fill="oklch(0.20 0 0)" text-anchor="middle">
    Get Started in 3 Easy Steps
  </text>
  
  <!-- Step 1 -->
  <g transform="translate(50, 80)">
    <rect width="320" height="180" rx="12" fill="url(#step1)"/>
    <circle cx="160" cy="40" r="24" fill="white"/>
    <text x="160" y="50" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="oklch(0.45 0.15 260)" text-anchor="middle">1</text>
    
    <text x="160" y="90" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">Install</text>
    
    <g transform="translate(20, 110)">
      <rect width="280" height="50" rx="6" fill="oklch(0.15 0 0)"/>
      <text x="140" y="33" font-family="'JetBrains Mono', monospace" font-size="14" fill="oklch(0.75 0.15 160)" text-anchor="middle">npx markdown-slides-presenter</text>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(390, 170)">
    <path d="M 0 0 L 40 0 L 30 -8 M 40 0 L 30 8" stroke="oklch(0.50 0.01 260)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Step 2 -->
  <g transform="translate(440, 80)">
    <rect width="320" height="180" rx="12" fill="url(#step2)"/>
    <circle cx="160" cy="40" r="24" fill="white"/>
    <text x="160" y="50" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="oklch(0.50 0.15 200)" text-anchor="middle">2</text>
    
    <text x="160" y="90" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">Create Slides</text>
    
    <g transform="translate(30, 110)">
      <rect width="260" height="50" rx="6" fill="oklch(0.15 0 0)"/>
      <text x="10" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="oklch(0.75 0.15 160)">
        <tspan x="10" dy="0"># My Presentation</tspan>
        <tspan x="10" dy="14">---</tspan>
      </text>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(780, 170)">
    <path d="M 0 0 L 40 0 L 30 -8 M 40 0 L 30 8" stroke="oklch(0.50 0.01 260)" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Step 3 -->
  <g transform="translate(830, 80)">
    <rect width="320" height="180" rx="12" fill="url(#step3)"/>
    <circle cx="160" cy="40" r="24" fill="white"/>
    <text x="160" y="50" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="oklch(0.55 0.15 140)" text-anchor="middle">3</text>
    
    <text x="160" y="90" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="white" text-anchor="middle">Present!</text>
    
    <g transform="translate(60, 110)">
      <text x="100" y="15" font-family="'Inter', sans-serif" font-size="16" fill="white" text-anchor="middle">Press O to load</text>
      <text x="100" y="40" font-family="'Inter', sans-serif" font-size="16" fill="white" text-anchor="middle">Press T for themes</text>
    </g>
  </g>
</svg>
