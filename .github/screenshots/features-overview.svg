<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:oklch(1 0 0);stop-opacity:1" />
      <stop offset="100%" style="stop-color:oklch(0.98 0 0);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="oklch(0.96 0 0)"/>
  
  <!-- Title -->
  <text x="600" y="50" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="700" fill="oklch(0.20 0 0)" text-anchor="middle">
    Why Choose Markdown Slides?
  </text>
  
  <!-- Feature Cards -->
  
  <!-- Card 1: Markdown -->
  <g transform="translate(50, 100)">
    <rect width="260" height="260" rx="12" fill="url(#cardBg)" stroke="oklch(0.85 0.01 260)" stroke-width="2"/>
    <text x="130" y="40" font-size="48" text-anchor="middle">📝</text>
    <text x="130" y="80" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="oklch(0.20 0 0)" text-anchor="middle">Markdown First</text>
    <text x="20" y="110" font-family="'Inter', sans-serif" font-size="14" fill="oklch(0.40 0 0)">
      <tspan x="20" dy="20">Write in familiar</tspan>
      <tspan x="20" dy="20">markdown syntax.</tspan>
      <tspan x="20" dy="20">No complex tools.</tspan>
      <tspan x="20" dy="25">Supports:</tspan>
      <tspan x="20" dy="20">• Headers & lists</tspan>
      <tspan x="20" dy="20">• Code blocks</tspan>
      <tspan x="20" dy="20">• Images & links</tspan>
    </text>
  </g>
  
  <!-- Card 2: Keyboard -->
  <g transform="translate(340, 100)">
    <rect width="260" height="260" rx="12" fill="url(#cardBg)" stroke="oklch(0.85 0.01 260)" stroke-width="2"/>
    <text x="130" y="40" font-size="48" text-anchor="middle">⌨️</text>
    <text x="130" y="80" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="oklch(0.20 0 0)" text-anchor="middle">Fast Navigation</text>
    <text x="20" y="110" font-family="'Inter', sans-serif" font-size="14" fill="oklch(0.40 0 0)">
      <tspan x="20" dy="20">Lightning-fast</tspan>
      <tspan x="20" dy="20">keyboard shortcuts.</tspan>
      <tspan x="20" dy="20">No mouse needed.</tspan>
      <tspan x="20" dy="25">Features:</tspan>
      <tspan x="20" dy="20">• Arrow navigation</tspan>
      <tspan x="20" dy="20">• Quick search (S)</tspan>
      <tspan x="20" dy="20">• Fullscreen (F)</tspan>
    </text>
  </g>
  
  <!-- Card 3: Themes -->
  <g transform="translate(630, 100)">
    <rect width="260" height="260" rx="12" fill="url(#cardBg)" stroke="oklch(0.85 0.01 260)" stroke-width="2"/>
    <text x="130" y="40" font-size="48" text-anchor="middle">🎨</text>
    <text x="130" y="80" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="oklch(0.20 0 0)" text-anchor="middle">Beautiful Themes</text>
    <text x="20" y="110" font-family="'Inter', sans-serif" font-size="14" fill="oklch(0.40 0 0)">
      <tspan x="20" dy="20">6 stunning themes</tspan>
      <tspan x="20" dy="20">with light/dark modes.</tspan>
      <tspan x="20" dy="20">Real-time preview.</tspan>
      <tspan x="20" dy="25">Includes:</tspan>
      <tspan x="20" dy="20">• Solarized</tspan>
      <tspan x="20" dy="20">• Dracula</tspan>
      <tspan x="20" dy="20">• Code & more</tspan>
    </text>
  </g>
  
  <!-- Card 4: Mobile -->
  <g transform="translate(920, 100)">
    <rect width="260" height="260" rx="12" fill="url(#cardBg)" stroke="oklch(0.85 0.01 260)" stroke-width="2"/>
    <text x="130" y="40" font-size="48" text-anchor="middle">📱</text>
    <text x="130" y="80" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="oklch(0.20 0 0)" text-anchor="middle">Cross-Platform</text>
    <text x="20" y="110" font-family="'Inter', sans-serif" font-size="14" fill="oklch(0.40 0 0)">
      <tspan x="20" dy="20">Works everywhere.</tspan>
      <tspan x="20" dy="20">Touch-optimized.</tspan>
      <tspan x="20" dy="20">Swipe gestures.</tspan>
      <tspan x="20" dy="25">Platforms:</tspan>
      <tspan x="20" dy="20">• Desktop</tspan>
      <tspan x="20" dy="20">• Tablet</tspan>
      <tspan x="20" dy="20">• Mobile</tspan>
    </text>
  </g>
</svg>
